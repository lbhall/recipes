# Recipes (Homemade) — bare-metal nginx, HTTP only (no SSL).
# Place at /etc/nginx/sites-available/recipes and symlink into sites-enabled,
# or drop into /etc/nginx/conf.d/recipes.conf. Then: sudo nginx -t && sudo systemctl reload nginx
#
# Pairs with the gunicorn-recipes systemd unit listening on the socket below.

upstream recipes_app {
    server unix:/run/gunicorn-recipes.sock;
}

server {
    listen 80;
    listen [::]:80;
    server_name recipes.emcfunleague.com;   # <-- change to your hostname

    # Allow recipe photo uploads (default nginx limit is 1m).
    client_max_body_size 15m;

    # Collected static assets (manage.py collectstatic -> STATIC_ROOT).
    location /static/ {
        alias /var/www/recipes/source/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # User-uploaded recipe photos (MEDIA_ROOT).
    location /media/ {
        alias /var/www/recipes/media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://recipes_app;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
