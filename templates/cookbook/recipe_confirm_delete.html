{% extends 'base.html' %}
{% block title %}Delete {{ recipe.name }}{% endblock %}
{% block content %}
<h1>Delete "{{ recipe.name }}"?</h1>
<p>This cannot be undone.</p>
<form method="post">
    {% csrf_token %}
    <button class="button danger" type="submit">Yes, delete</button>
    <a href="{{ recipe.get_absolute_url }}">Cancel</a>
</form>
{% endblock %}
